name: Generate Notes Assets

on:
  push:
    branches:
      - main
    paths:
      - 'Notes/**'

permissions:
  contents: write

jobs:
  process-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Tools
        run: |
          sudo apt-get update
          # Added clamav and clamav-daemon
          sudo apt-get install -y ghostscript poppler-utils unoconv imagemagick clamav clamav-daemon

          sudo systemctl stop clamav-freshclam

          sudo freshclam

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Node Deps
        run: npm install @octokit/rest

      # --- 0. PREPARE LOG FILE ---
      - name: Init Log
        run: |
          mkdir -p resources
          LOG_FILE="resources/system_log.md"
          if [ ! -f "$LOG_FILE" ]; then
            echo "| Date (UTC) | Level | Event | Details |" > "$LOG_FILE"
            echo "|---|---|---|---|" >> "$LOG_FILE"
          fi

      # --- 1. SECURITY SCAN (Priority #1) ---
      - name: Virus Scan & Removal
        run: |
          LOG_FILE="resources/system_log.md"
          DATE=$(date -u +"%Y-%m-%d %H:%M")
          
          echo "Starting ClamAV Scan..."
          
          if [ -s infected_list.txt ]; then
            echo "⚠️ VIRUS DETECTED"
            
            while IFS= read -r line; do
              # line format is usually: filename: VirusName FOUND
              FILE=$(echo "$line" | cut -d: -f1)
              VIRUS=$(echo "$line" | cut -d: -f2 | sed 's/ FOUND//')
              
              # Get Uploader Info from Git
              UPLOADER=$(git log -1 --format='%cn (%ce)' -- "$FILE")
              UPLOAD_DATE=$(git log -1 --format='%cd' -- "$FILE")
              
              echo "Deleting infected file: $FILE ($VIRUS)"
              
              # Log to file
              echo "| $DATE | 🔴 **VIRUS** | Detected & Deleted | File: \`$FILE\` <br> Virus: \`$VIRUS\` <br> Uploader: $UPLOADER <br> Date: $UPLOAD_DATE |" >> "$LOG_FILE"
              
              # Delete the file
              sudo rm -f "$FILE"
              
            done < infected_list.txt
            
            # Remove the temp list
            rm infected_list.txt
            
            # Configure git to commit this removal immediately so subsequent steps don't fail
            git config --global user.email "security@tebby.io"
            git config --global user.name "SecurityBot"
            git add Notes/ resources/system_log.md
            git commit -m "Security: Removed infected files [skip ci]"
          else
            echo "✅ No viruses found."
          fi

      # --- 2. SMART COMPRESSION ---
      - name: Compress New/Modified PDFs
        run: |
          LOG_FILE="resources/system_log.md"
          DATE=$(date -u +"%Y-%m-%d %H:%M")
          
          CHANGED_PDFS=$(git diff --name-only --diff-filter=AM HEAD^ HEAD | grep "^Notes/.*\.pdf$" || true)
          
          if [ ! -z "$CHANGED_PDFS" ]; then
            echo "$CHANGED_PDFS" | while read -r file; do
              if [ -f "$file" ]; then
                 UPLOADER=$(git log -1 --format='%cn' -- "$file")
                 
                 if [[ "$UPLOADER" == "NotesPlatformBot" ]]; then
                     size=$(stat -c%s "$file")
                     if [ $size -gt 2000000 ]; then
                        echo "Compressing $file..."
                        gs -sDEVICE=pdfwrite -dCompatibilityLevel=1.4 -dPDFSETTINGS=/ebook -dNOPAUSE -dQUIET -dBATCH -sOutputFile="compressed_temp.pdf" "$file"
                        
                        new_size=$(stat -c%s "compressed_temp.pdf")
                        if [ $new_size -lt $size ]; then
                           mv "compressed_temp.pdf" "$file"
                           SAVED=$(( ($size - $new_size) / 1024 ))
                           echo "| $DATE | 🟡 COMPRESS | Optimization | File: \`$file\` <br> Saved: ${SAVED}KB |" >> "$LOG_FILE"
                        else
                           rm "compressed_temp.pdf"
                        fi
                     fi
                 fi
              fi
            done
          fi

      # --- 3. THUMBNAILS ---
      - name: Generate Thumbnails
        run: |
          mkdir -p resources/thumbnails
          LOG_FILE="resources/system_log.md"
          DATE=$(date -u +"%Y-%m-%d %H:%M")
          
          CHANGED_FILES=$(git diff --name-only --diff-filter=AM HEAD^ HEAD || true)

          find Notes/ -type f \( -name "*.pdf" -o -name "*.docx" \) | while read -r NOTE; do
            NOTE_NAME=$(basename "$NOTE" | sed 's/\(.*\)\./\1_/')
            THUMBNAIL_PATH="resources/thumbnails/${NOTE_NAME}.jpg"
            GENERATE=false
            REASON=""

            if [[ ! -f "$THUMBNAIL_PATH" ]]; then
              GENERATE=true
              REASON="Missing"
            elif echo "$CHANGED_FILES" | grep -Fq "$NOTE"; then
              GENERATE=true
              REASON="Updated"
            fi

            if [ "$GENERATE" = true ]; then
                echo "Generating thumb for $NOTE..."
                if [[ "$NOTE" == *.pdf ]]; then
                  pdftocairo -jpeg -singlefile -scale-to 600 "$NOTE" "${THUMBNAIL_PATH%.jpg}"
                elif [[ "$NOTE" == *.docx ]]; then
                  unoconv --stdout -f pdf "$NOTE" > temp.pdf
                  pdftocairo -jpeg -singlefile -scale-to 600 temp.pdf "${THUMBNAIL_PATH%.jpg}"
                  rm temp.pdf
                fi
                if [[ -f "${THUMBNAIL_PATH%.jpg}.jpg" ]]; then
                  mogrify -quality 70 "${THUMBNAIL_PATH%.jpg}.jpg"
                  # Log the generation
                  echo "| $DATE | 🟢 THUMB | Generated | File: \`$NOTE\` <br> Reason: $REASON |" >> "$LOG_FILE"
                fi
            fi
          done

      # --- 4. CLEANUP ORPHANS ---
      - name: Cleanup Orphaned Thumbnails
        run: |
          LOG_FILE="resources/system_log.md"
          DATE=$(date -u +"%Y-%m-%d %H:%M")
          
          touch valid_thumbnails.txt
          find Notes/ -type f \( -name "*.pdf" -o -name "*.docx" \) | while read -r NOTE; do
            NOTE_NAME=$(basename "$NOTE" | sed 's/\(.*\)\./\1_/')
            echo "${NOTE_NAME}.jpg" >> valid_thumbnails.txt
          done

          for THUMBNAIL in resources/thumbnails/*.jpg; do
            [ -e "$THUMBNAIL" ] || continue
            FILENAME=$(basename "$THUMBNAIL")
            if ! grep -Fxq "$FILENAME" valid_thumbnails.txt; then
              rm "$THUMBNAIL"
              echo "| $DATE | 🗑️ CLEANUP | Deleted Thumbnail | File: \`$FILENAME\` (Original note deleted) |" >> "$LOG_FILE"
            fi
          done
          rm valid_thumbnails.txt

      # --- 5. METADATA JSON ---
      - name: Generate Metadata JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node .github/workflows/generate-notes-metadata.js

      # --- 6. COMMIT ---
      - name: Commit changes
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          git add Notes/ resources/
          
          if [[ -n $(git status --porcelain) ]]; then
            git commit -m "Auto: Restored Assets & Processed Notes [skip ci]"
            git pull --rebase
            git push
          else
            echo "No changes."
          fi