name: Generate Notes Assets

on:
  push:
    branches:
      - main
    paths:
      - 'Notes/**'

permissions:
  contents: write

jobs:
  process-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # CRITICAL: We need the previous commit to detect changes

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript poppler-utils unoconv imagemagick

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Node Deps
        run: npm install @octokit/rest

      # --- 1. SMART COMPRESSION (Only changed files) ---
      - name: Compress New/Modified PDFs
        run: |
          # Get list of changed PDF files in Notes/ directory
          # 'git diff' checks differences between previous commit (HEAD^) and current (HEAD)
          CHANGED_PDFS=$(git diff --name-only --diff-filter=AM HEAD^ HEAD | grep "^Notes/.*\.pdf$" || true)
          
          if [ -z "$CHANGED_PDFS" ]; then
            echo "No new PDFs detected. Skipping compression."
          else
            echo "Detected changed PDFs:"
            echo "$CHANGED_PDFS"
            
            # Loop through them using newline as separator
            echo "$CHANGED_PDFS" | while read -r file; do
              if [ -f "$file" ]; then
                 echo "Processing: $file"
                 
                 # 2MB Limit Check
                 size=$(stat -c%s "$file")
                 if [ $size -gt 2000000 ]; then
                    echo "Compressing $file..."
                    gs -sDEVICE=pdfwrite -dCompatibilityLevel=1.4 -dPDFSETTINGS=/ebook \
                       -dNOPAUSE -dQUIET -dBATCH -sOutputFile="compressed_temp.pdf" "$file"
                    
                    new_size=$(stat -c%s "compressed_temp.pdf")
                    if [ $new_size -lt $size ]; then
                       echo "Compression saved space ($size -> $new_size). Replacing."
                       mv "compressed_temp.pdf" "$file"
                    else
                       echo "No gain. Keeping original."
                       rm "compressed_temp.pdf"
                    fi
                 else
                    echo "File under 2MB. Skipping compression."
                 fi
              fi
            done
          fi

      # --- 2. SMART THUMBNAILS (Only changed files + Missing ones) ---
      - name: Generate Thumbnails
        run: |
          mkdir -p resources/thumbnails
          
          # A. Handle NEW files (Incremental)
          # We look for ANY changed file in Notes (PDF or DOCX)
          CHANGED_FILES=$(git diff --name-only --diff-filter=AM HEAD^ HEAD | grep "^Notes/.*\.\(pdf\|docx\)$" || true)

          if [ -n "$CHANGED_FILES" ]; then
            echo "$CHANGED_FILES" | while read -r NOTE; do
              if [ -f "$NOTE" ]; then
                NOTE_NAME=$(basename "$NOTE" | sed 's/\(.*\)\./\1_/')
                THUMBNAIL_PATH="resources/thumbnails/${NOTE_NAME}.jpg"
                
                echo "Generating/Updating thumbnail for: $NOTE"
                if [[ "$NOTE" == *.pdf ]]; then
                  pdftocairo -jpeg -singlefile -scale-to 600 "$NOTE" "${THUMBNAIL_PATH%.jpg}"
                elif [[ "$NOTE" == *.docx ]]; then
                  unoconv --stdout -f pdf "$NOTE" > temp.pdf
                  pdftocairo -jpeg -singlefile -scale-to 600 temp.pdf "${THUMBNAIL_PATH%.jpg}"
                  rm temp.pdf
                fi
                
                if [[ -f "${THUMBNAIL_PATH%.jpg}.jpg" ]]; then
                  mogrify -quality 70 "${THUMBNAIL_PATH%.jpg}.jpg"
                fi
              fi
            done
          fi

          # B. Cleanup Orphans (Fast & Safe)
          # Removes thumbnails for notes that were deleted
          find Notes/ -type f \( -name "*.pdf" -o -name "*.docx" \) > existing_notes.txt
          for THUMBNAIL in resources/thumbnails/*.jpg; do
            NOTE_NAME=$(basename "$THUMBNAIL" .jpg | sed 's/\(.*\)_/\1./')
            if ! grep -q "Notes/${NOTE_NAME}.pdf" existing_notes.txt && ! grep -q "Notes/${NOTE_NAME}.docx" existing_notes.txt; then
              echo "Deleting orphan: $THUMBNAIL"
              rm "$THUMBNAIL"
            fi
          done
          rm existing_notes.txt

      # --- 3. METADATA JSON (Always Full Scan for Safety) ---
      - name: Generate Metadata JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node .github/workflows/generate-notes-metadata.js

      # --- 4. COMMIT ---
      - name: Commit changes
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Add only tracked folders to avoid adding random temp files
          git add Notes/ resources/
          
          if [[ -n $(git status --porcelain) ]]; then
            git commit -m "Auto: Optimized Notes & Assets [skip ci]"
            git pull --rebase
            git push
          else
            echo "No changes needed."
          fi
