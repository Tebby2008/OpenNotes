name: Generate Notes Assets

on:
  push:
    branches:
      - main
    paths:
      - 'Notes/**'

permissions:
  contents: write

jobs:
  process-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Needed for git diff

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript poppler-utils unoconv imagemagick

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Node Deps
        run: npm install @octokit/rest

      # --- 1. SMART COMPRESSION (Only New/Modified files) ---
      - name: Compress New/Modified PDFs
        run: |
          # Detect changed PDFs
          CHANGED_PDFS=$(git diff --name-only --diff-filter=AM HEAD^ HEAD | grep "^Notes/.*\.pdf$" || true)
          
          if [ -z "$CHANGED_PDFS" ]; then
            echo "No new PDFs detected. Skipping compression."
          else
            echo "$CHANGED_PDFS" | while read -r file; do
              if [ -f "$file" ]; then
                 # Only compress if > 2MB
                 size=$(stat -c%s "$file")
                 if [ $size -gt 2000000 ]; then
                    echo "Compressing $file..."
                    gs -sDEVICE=pdfwrite -dCompatibilityLevel=1.4 -dPDFSETTINGS=/ebook \
                       -dNOPAUSE -dQUIET -dBATCH -sOutputFile="compressed_temp.pdf" "$file"
                    
                    new_size=$(stat -c%s "compressed_temp.pdf")
                    if [ $new_size -lt $size ]; then
                       echo "Compression saved space. Replacing."
                       mv "compressed_temp.pdf" "$file"
                    else
                       rm "compressed_temp.pdf"
                    fi
                 fi
              fi
            done
          fi

      # --- 2. SMART THUMBNAILS (Generation + Safe Cleanup) ---
      - name: Generate & Cleanup Thumbnails
        run: |
          mkdir -p resources/thumbnails
          
          # A. GENERATE MISSING/UPDATED THUMBNAILS
          # Check changed files (incremental)
          CHANGED_FILES=$(git diff --name-only --diff-filter=AM HEAD^ HEAD | grep "^Notes/.*\.\(pdf\|docx\)$" || true)

          if [ -n "$CHANGED_FILES" ]; then
            echo "$CHANGED_FILES" | while read -r NOTE; do
              if [ -f "$NOTE" ]; then
                # Logic: Replace last dot with underscore
                NOTE_NAME=$(basename "$NOTE" | sed 's/\(.*\)\./\1_/')
                THUMBNAIL_PATH="resources/thumbnails/${NOTE_NAME}.jpg"
                
                echo "Generating thumbnail for: $NOTE"
                if [[ "$NOTE" == *.pdf ]]; then
                  pdftocairo -jpeg -singlefile -scale-to 600 "$NOTE" "${THUMBNAIL_PATH%.jpg}"
                elif [[ "$NOTE" == *.docx ]]; then
                  unoconv --stdout -f pdf "$NOTE" > temp.pdf
                  pdftocairo -jpeg -singlefile -scale-to 600 temp.pdf "${THUMBNAIL_PATH%.jpg}"
                  rm temp.pdf
                fi
                
                # Compress thumbnail image
                if [[ -f "${THUMBNAIL_PATH%.jpg}.jpg" ]]; then
                  mogrify -quality 70 "${THUMBNAIL_PATH%.jpg}.jpg"
                fi
              fi
            done
          fi

          # B. SAFE CLEANUP (The Fix)
          # 1. Generate a list of all valid thumbnail names based on current Notes
          touch valid_thumbnails.txt
          find Notes/ -type f \( -name "*.pdf" -o -name "*.docx" \) | while read -r NOTE; do
            # Use exact same naming logic as generation
            NOTE_NAME=$(basename "$NOTE" | sed 's/\(.*\)\./\1_/')
            echo "${NOTE_NAME}.jpg" >> valid_thumbnails.txt
          done

          # 2. Delete actual thumbnails NOT in the valid list
          for THUMBNAIL in resources/thumbnails/*.jpg; do
            [ -e "$THUMBNAIL" ] || continue # Skip if folder empty
            
            FILENAME=$(basename "$THUMBNAIL")
            
            # grep -F (Fixed string) -x (Exact line) -q (Quiet)
            # This handles spaces, brackets, and symbols correctly
            if ! grep -Fxq "$FILENAME" valid_thumbnails.txt; then
              echo "Deleting orphan thumbnail: $FILENAME"
              rm "$THUMBNAIL"
            fi
          done
          rm valid_thumbnails.txt

      # --- 3. METADATA JSON (Full Scan) ---
      - name: Generate Metadata JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node .github/workflows/generate-notes-metadata.js

      # --- 4. COMMIT ---
      - name: Commit changes
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          git add Notes/ resources/
          
          if [[ -n $(git status --porcelain) ]]; then
            git commit -m "Auto: Processed Notes & Cleaned Assets [skip ci]"
            git pull --rebase
            git push
          else
            echo "No changes."
          fi
