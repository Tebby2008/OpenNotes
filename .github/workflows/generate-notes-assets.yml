name: Generate Notes Assets

on:
  push:
    branches:
      - main
    paths:
      - 'Notes/**'

permissions:
  contents: write

jobs:
  process-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript poppler-utils unoconv imagemagick

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Node Deps
        run: npm install @octokit/rest

      # --- 1. SMART COMPRESSION (Bot Uploads Only) ---
      - name: Compress New/Modified PDFs
        run: |
          # Detect changed PDFs
          CHANGED_PDFS=$(git diff --name-only --diff-filter=AM HEAD^ HEAD | grep "^Notes/.*\.pdf$" || true)
          
          if [ -z "$CHANGED_PDFS" ]; then
            echo "No new PDFs to compress."
          else
            echo "$CHANGED_PDFS" | while read -r file; do
              if [ -f "$file" ]; then
                 
                 # CHECK: Who uploaded this?
                 # %cn gets the Committer Name of the last commit that touched this file
                 UPLOADER=$(git log -1 --format='%cn' -- "$file")
                 
                 echo "File: $file | Uploaded by: $UPLOADER"

                 # Only proceed if the uploader is your Worker Bot
                 if [[ "$UPLOADER" == "NotesPlatformBot" ]]; then
                     
                     size=$(stat -c%s "$file")
                     if [ $size -gt 2000000 ]; then
                        echo ">> Bot upload detected > 2MB. Compressing..."
                        
                        gs -sDEVICE=pdfwrite -dCompatibilityLevel=1.4 -dPDFSETTINGS=/ebook \
                           -dNOPAUSE -dQUIET -dBATCH -sOutputFile="compressed_temp.pdf" "$file"
                        
                        new_size=$(stat -c%s "compressed_temp.pdf")
                        if [ $new_size -lt $size ]; then
                           mv "compressed_temp.pdf" "$file"
                        else
                           rm "compressed_temp.pdf"
                        fi
                     else
                        echo ">> Bot upload, but file is small. Skipping."
                     fi
                 else
                     echo ">> Manual upload by user. Skipping compression."
                 fi
              fi
            done
          fi

      # --- 2. THUMBNAILS (Generate Missing + Update Changed) ---
      - name: Generate & Restore Thumbnails
        run: |
          mkdir -p resources/thumbnails
          
          # Get list of changed files (for updates)
          CHANGED_FILES=$(git diff --name-only --diff-filter=AM HEAD^ HEAD || true)

          # Loop through ALL notes (to catch missing thumbnails)
          find Notes/ -type f \( -name "*.pdf" -o -name "*.docx" \) | while read -r NOTE; do
            
            # Calculate expected thumbnail path
            NOTE_NAME=$(basename "$NOTE" | sed 's/\(.*\)\./\1_/')
            THUMBNAIL_PATH="resources/thumbnails/${NOTE_NAME}.jpg"
            
            GENERATE=false

            # Condition A: Thumbnail is completely missing (Restores your deleted ones)
            if [[ ! -f "$THUMBNAIL_PATH" ]]; then
              echo "[Restoring] Missing thumbnail for: $NOTE"
              GENERATE=true
            fi

            # Condition B: Note was just updated (Updates existing thumbnail)
            if echo "$CHANGED_FILES" | grep -Fq "$NOTE"; then
              echo "[Updating] Note file changed: $NOTE"
              GENERATE=true
            fi

            # Execute Generation
            if [ "$GENERATE" = true ]; then
                if [[ "$NOTE" == *.pdf ]]; then
                  pdftocairo -jpeg -singlefile -scale-to 600 "$NOTE" "${THUMBNAIL_PATH%.jpg}"
                elif [[ "$NOTE" == *.docx ]]; then
                  unoconv --stdout -f pdf "$NOTE" > temp.pdf
                  pdftocairo -jpeg -singlefile -scale-to 600 temp.pdf "${THUMBNAIL_PATH%.jpg}"
                  rm temp.pdf
                fi
                
                # Optimize JPG
                if [[ -f "${THUMBNAIL_PATH%.jpg}.jpg" ]]; then
                  mogrify -quality 70 "${THUMBNAIL_PATH%.jpg}.jpg"
                fi
            fi
          done

      # --- 3. CLEANUP ORPHANS ---
      # This deletes thumbnails for notes that were ACTUALLY deleted from the repo
      - name: Cleanup Orphaned Thumbnails
        run: |
          touch valid_thumbnails.txt
          find Notes/ -type f \( -name "*.pdf" -o -name "*.docx" \) | while read -r NOTE; do
            NOTE_NAME=$(basename "$NOTE" | sed 's/\(.*\)\./\1_/')
            echo "${NOTE_NAME}.jpg" >> valid_thumbnails.txt
          done

          for THUMBNAIL in resources/thumbnails/*.jpg; do
            [ -e "$THUMBNAIL" ] || continue
            FILENAME=$(basename "$THUMBNAIL")
            if ! grep -Fxq "$FILENAME" valid_thumbnails.txt; then
              echo "Deleting orphan thumbnail: $FILENAME"
              rm "$THUMBNAIL"
            fi
          done
          rm valid_thumbnails.txt

      # --- 4. METADATA JSON ---
      - name: Generate Metadata JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node .github/workflows/generate-notes-metadata.js

      # --- 5. COMMIT ---
      - name: Commit changes
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          git add Notes/ resources/
          
          if [[ -n $(git status --porcelain) ]]; then
            git commit -m "Auto: Restored Assets & Processed Notes [skip ci]"
            git pull --rebase
            git push
          else
            echo "No changes."
          fi
