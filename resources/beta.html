<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OpenNotes | Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="description" content="Open platform for notes.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/Tebby2008/OpenNotes/main/resources/favicon.png">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@2.3.6/dist/purify.min.js" defer></script>

  <style>
    :root {
      --font: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      
      /* Light Theme */
      --bg-body: #f0f2f5;
      --bg-panel: #ffffff;
      --bg-sidebar: #ffffff;
      --border: #edf2f7;
      
      --text-main: #1a202c;
      --text-sec: #718096;
      --text-muted: #a0aec0;
      
      --primary: #6366f1;
      --primary-soft: #e0e7ff;
      --primary-hover: #4f46e5;
      
      --accent-ai: #f59e0b;
      --bg-ai: #fffbeb;
      
      --pdf: #ef4444;
      --docx: #3b82f6;

      --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
      --shadow-hover: 0 20px 40px -5px rgba(0, 0, 0, 0.1);
      
      --radius-lg: 24px;
      --radius-pill: 999px;
      
      --sidebar-width: 260px;
      --header-height: 80px;
      
      /* Animations */
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-smooth: cubic-bezier(0.2, 0, 0, 1);
      
      --trans: all 0.3s var(--ease-bounce);
    }

    .dark-mode {
      --bg-body: #0f172a;
      --bg-panel: #1e293b;
      --bg-sidebar: #1e293b;
      --border: #334155;
      
      --text-main: #f8fafc;
      --text-sec: #94a3b8;
      --text-muted: #64748b;
      
      --primary: #818cf8;
      --primary-soft: rgba(99, 102, 241, 0.15);
      
      --accent-ai: #fbbf24;
      --bg-ai: rgba(251, 191, 36, 0.15);
      
      --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
      --shadow-hover: 0 20px 40px -5px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body { 
      margin: 0; background: var(--bg-body); color: var(--text-main); 
      font-family: var(--font); height: 100vh; overflow: hidden; 
      display: flex; transition: background 0.3s; 
    }
    
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    
    /* Icons */
    .material-symbols-rounded { font-size: 20px; font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24; transition: 0.3s; }
    .fill { font-variation-settings: 'FILL' 1; }

    /* Layout */
    .app-container { display: flex; width: 100%; height: 100%; padding: 16px; gap: 16px; }
    
    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width); 
      background: var(--bg-sidebar); 
      border-radius: var(--radius-lg);
      display: flex; flex-direction: column; 
      padding: 24px;
      box-shadow: var(--shadow);
      z-index: 20;
      transition: transform 0.4s var(--ease-smooth), background 0.3s;
    }
    
    /* Logo Styling */
    .brand { margin-bottom: 24px; padding: 0 8px; }
    .brand-logo, .brand-sub img { 
        display: block; transition: filter 0.3s; 
    }
    .brand-logo { width: 100%; max-width: 160px; height: auto; }
    .brand-sub { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-top: 8px; padding-left: 4px; display: flex; gap: 6px; align-items: center; }
    
    /* Light Mode: Invert and Hue Rotate (Flip blue to orange back to blue) */
    .brand-logo, .brand-sub img { filter: invert(1) hue-rotate(180deg) brightness(0.8); }
    /* Dark Mode: Uninvert (Raw) */
    .dark-mode .brand-logo, .dark-mode .brand-sub img { filter: none; }

    .nav-section { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
    .nav-label { 
      text-transform: uppercase; font-size: 10px; font-weight: 800; 
      color: var(--text-muted); letter-spacing: 1.5px; margin-bottom: 8px; padding-left: 12px; 
    }
    
    .nav-item {
      display: flex; align-items: center; gap: 12px; padding: 12px 16px;
      border-radius: var(--radius-pill); color: var(--text-sec); 
      font-weight: 600; font-size: 14px;
      transition: var(--trans);
    }
    .nav-item:hover { background: var(--bg-body); color: var(--text-main); transform: translateX(4px); }
    .nav-item.active { background: var(--primary); color: white; box-shadow: 0 8px 20px -4px var(--primary-soft); }
    
    /* Force white icons when active */
    .nav-item.active .material-symbols-rounded { font-variation-settings: 'FILL' 1; color: white !important; }

    /* Icon Row for Info */
    .icon-row { display: flex; justify-content: space-between; padding: 0 4px; margin-top: auto; margin-bottom: 16px; }
    .icon-btn-sm {
        width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
        border-radius: 50%; color: var(--text-sec); transition: var(--trans);
        background: var(--bg-body);
    }
    .icon-btn-sm:hover { background: var(--primary-soft); color: var(--primary); transform: translateY(-3px); }

    /* Stat Card */
    .stat-card {
      background: var(--bg-body); padding: 16px; border-radius: 20px; 
      display: flex; flex-direction: column; gap: 10px;
    }
    .dark-mode .stat-card { background: rgba(0,0,0,0.2); }
    .stat-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; }
    .stat-val { font-size: 13px; color: var(--primary); }
    
    /* Main Content */
    .main-content { 
      flex: 1; background: var(--bg-panel); 
      border-radius: var(--radius-lg); 
      box-shadow: var(--shadow);
      display: flex; flex-direction: column; overflow: hidden; position: relative; 
    }
    
    .top-bar {
      height: var(--header-height); 
      display: flex; align-items: center; justify-content: space-between; 
      padding: 0 32px; flex-shrink: 0; z-index: 10;
    }

    .search-wrapper {
      position: relative; width: 100%; max-width: 450px;
      transition: var(--trans);
    }
    .search-wrapper:focus-within { transform: scale(1.02); }
    .search-wrapper .icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    .search-input {
      width: 100%; padding: 14px 20px 14px 48px; 
      border-radius: var(--radius-pill); border: 2px solid transparent;
      background: var(--bg-body); color: var(--text-main); 
      font-size: 14px; font-weight: 600; font-family: var(--font);
      transition: var(--trans);
    }
    .search-input:focus { border-color: var(--primary); background: var(--bg-panel); box-shadow: 0 0 0 4px var(--primary-soft); }

    .actions { display: flex; align-items: center; gap: 12px; }
    .btn-circle {
      width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; background: var(--bg-body); color: var(--text-sec);
      transition: var(--trans);
    }
    .btn-circle:hover { background: var(--primary-soft); color: var(--primary); transform: rotate(15deg) scale(1.1); }
    
    /* Standard Active State for Toggle Buttons (Solid Dark) */
    .btn-circle.active { background: var(--text-main); color: var(--bg-panel); }
    
    /* Subtle AI Active State - Just same as standard active to be less distracting */
    .btn-circle.active-ai { background: var(--text-main); color: var(--bg-panel); }
    .btn-circle.active-ai .material-symbols-rounded { font-variation-settings: 'FILL' 1; }

    /* Gallery */
    .scroll-area { flex: 1; overflow-y: auto; padding: 10px 32px 32px; scroll-behavior: smooth; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; padding-bottom: 80px; }
    .list { display: flex; flex-direction: column; gap: 16px; padding-bottom: 80px; }

    /* Cards */
    .card {
      background: var(--bg-panel); border: 1px solid var(--border); 
      border-radius: 20px; overflow: hidden; cursor: pointer; 
      position: relative; display: flex; flex-direction: column;
      box-shadow: var(--shadow);
      opacity: 0; transform: translateY(30px) scale(0.9);
      animation: popIn 0.6s var(--ease-bounce) forwards;
      transition: transform 0.4s var(--ease-bounce), box-shadow 0.4s var(--ease-bounce);
    }
    @keyframes popIn { to { opacity: 1; transform: translateY(0) scale(1); } }
    
    .card:hover { transform: translateY(-10px) scale(1.02); box-shadow: var(--shadow-hover); border-color: transparent; z-index: 2; }

    .card-thumb {
      height: 180px; background: var(--bg-body); position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center; margin: 8px 8px 0; border-radius: 16px;
    }
    .card-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s var(--ease-bounce); border-radius: 16px; }
    .card:hover .card-thumb img { transform: scale(1.1); }
    
    .type-pill {
      position: absolute; top: 12px; right: 12px; padding: 6px 12px; border-radius: 99px;
      font-size: 11px; font-weight: 800; background: rgba(255,255,255,0.9); backdrop-filter: blur(4px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.1); letter-spacing: 0.5px;
    }
    .dark-mode .type-pill { background: rgba(30,41,59,0.9); }
    .is-pdf { color: var(--pdf); } .is-docx { color: var(--docx); }
    
    .card-body { padding: 16px; display: flex; flex-direction: column; flex: 1; gap: 8px; }
    .card-title { font-weight: 700; font-size: 16px; line-height: 1.4; color: var(--text-main); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    
    .card-footer { margin-top: auto; display: flex; align-items: center; justify-content: space-between; padding-top: 8px; }
    .user-info { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--text-sec); }
    
    .ai-badge {
      display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 99px;
      background: var(--bg-ai); color: var(--accent-ai); font-size: 11px; font-weight: 700;
    }
    
    .stats-row { display: flex; gap: 10px; font-size: 12px; font-weight: 700; color: var(--text-muted); }
    .stat-item { display: flex; align-items: center; gap: 4px; }
    
    /* List View Overrides */
    .list .card { flex-direction: row; height: 90px; align-items: center; padding: 0 20px 0 10px; }
    .list .card-thumb { width: 70px; height: 70px; margin: 0; flex-shrink: 0; }
    .list .card-body { flex-direction: row; align-items: center; padding: 0 0 0 16px; }
    .list .card-title { margin: 0; width: 35%; -webkit-line-clamp: 1; }
    .list .card-footer { margin: 0; padding: 0; flex: 1; justify-content: flex-end; gap: 20px; }
    .list .type-pill { display: none; }

    /* Drawer / Viewer - SMOOTH ANIMATION */
    .drawer-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px);
      z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .drawer-overlay.open { opacity: 1; pointer-events: auto; }
    
    .drawer {
      position: fixed; top: 16px; right: 16px; bottom: 16px; width: 850px; max-width: calc(100% - 32px);
      background: var(--bg-panel); border-radius: 24px; box-shadow: -10px 0 50px rgba(0,0,0,0.2);
      z-index: 101; 
      transform: translateX(110%); transition: transform 0.5s var(--ease-smooth);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .drawer-overlay.open .drawer { transform: translateX(0); }

    .drawer-header {
      height: 70px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
    }
    .drawer-title { font-weight: 800; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%; }
    
    .drawer-content { flex: 1; display: flex; overflow: hidden; }
    .doc-viewer { flex: 1; background: #f0f0f0; border: none; }
    
    .drawer-sidebar { width: 300px; border-left: 1px solid var(--border); padding: 24px; overflow-y: auto; background: var(--bg-body); }
    .ds-section { margin-bottom: 32px; background: var(--bg-panel); padding: 16px; border-radius: 16px; box-shadow: var(--shadow); }
    
    .btn-main {
      display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
      background: var(--primary); color: white; padding: 14px; border-radius: 99px;
      font-weight: 700; transition: var(--trans);
    }
    .btn-main:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 10px 20px -5px var(--primary-hover); }
    
    .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
    .info-row:last-child { border: none; }
    
    /* Dropdown */
    .dropdown { position: relative; }
    .dropdown-menu {
      position: absolute; top: calc(100% + 12px); right: 0;
      background: var(--bg-panel); border: 1px solid var(--border); border-radius: 20px;
      box-shadow: var(--shadow-hover); width: 220px; opacity: 0; transform: translateY(10px) scale(0.9); 
      pointer-events: none; transition: var(--trans); z-index: 50; padding: 8px; transform-origin: top right;
    }
    .dropdown.active .dropdown-menu { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
    .dd-item { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 600; color: var(--text-sec); border-radius: 12px; cursor: pointer; transition: 0.2s; }
    .dd-item:hover { background: var(--bg-body); color: var(--text-main); }
    .dd-item.active { color: var(--primary); background: var(--primary-soft); }

    /* Notification */
    .toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: var(--text-main); color: var(--bg-panel); padding: 14px 28px;
      border-radius: 99px; display: flex; align-items: center; gap: 12px;
      box-shadow: var(--shadow-hover); font-weight: 700; opacity: 0; transition: var(--trans); z-index: 2000;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* Markdown Info Overlay - SMOOTH ANIMATION */
    .info-overlay {
      position: fixed; inset: 0; z-index: 200; background: var(--bg-panel);
      display: flex; flex-direction: column; 
      transform: translateY(100%); transition: transform 0.5s var(--ease-smooth);
    }
    .info-overlay.open { transform: translateY(0); }
    .info-container { max-width: 800px; margin: 0 auto; padding: 40px 24px; width: 100%; overflow-y: auto; }
    .markdown-body { line-height: 1.7; color: var(--text-main); font-size: 1.1rem; }
    .markdown-body h1 { font-size: 2.5rem; letter-spacing: -1px; margin-bottom: 1rem; }
    .markdown-body a { color: var(--primary); text-decoration: underline; text-decoration-thickness: 2px; }

    /* Dark Mode Toggle Button */
    #themeToggle { color: var(--text-sec); transition: color 0.3s; }
    .dark-mode #themeToggle { color: #ffffff !important; }

    /* Mobile */
    .mobile-btn { display: none; }
    
    @media (max-width: 900px) {
      .app-container { flex-direction: column; padding: 0; gap: 0; }
      .sidebar { 
        position: fixed; top: 0; bottom: 0; left: 0; width: 280px; border-radius: 0; 
        transform: translateX(-100%); padding-top: 80px; 
      }
      .sidebar.open { transform: translateX(0); }
      
      .main-content { border-radius: 0; height: 100%; }
      .mobile-btn { display: flex; }
      .top-bar { padding: 0 16px; gap: 12px; }
      .search-wrapper { flex: 1; max-width: none; }
      
      .drawer { top:0; left:0; right:0; bottom:0; width:100%; max-width:100%; border-radius:0; transform: translateY(100%); }
      .drawer-overlay.open .drawer { transform: translateY(0); }
      .drawer-content { flex-direction: column; }
      .doc-viewer { height: 45vh; }
      .drawer-sidebar { width: 100%; height: 55vh; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="https://raw.githubusercontent.com/Tebby2008/OpenNotes/main/resources/logo.svg" alt="OpenNotes" class="brand-logo" />
        <div class="brand-sub">by <img src="https://raw.githubusercontent.com/Tebby2008/OpenNotes/main/resources/ingenium.png" style="height:14px;width:auto;margin:0"></div>
      </div>

      <div class="nav-section">
        <div class="nav-label">Library</div>
        <button class="nav-item active" id="filterAll">
          <span class="material-symbols-rounded fill">grid_view</span> <span>All Notes</span>
        </button>
        <button class="nav-item" id="filterPdf">
          <span class="material-symbols-rounded" style="color:var(--pdf)">picture_as_pdf</span> <span>PDF Docs</span>
        </button>
        <button class="nav-item" id="filterDocx">
          <span class="material-symbols-rounded" style="color:var(--docx)">description</span> <span>Word Docs</span>
        </button>
      </div>
      
      <div class="nav-section">
        <div class="nav-label">Tools</div>
        <a href="https://opennotes.pages.dev/codeprep" target="_blank" class="nav-item">
            <span class="material-symbols-rounded" style="color:#10b981">code</span> <span>CodePrep</span>
        </a>
      </div>

      <!-- Icon Row for Info -->
      <div class="icon-row">
        <button class="icon-btn-sm" data-md="resources/upload.md" title="Upload"><span class="material-symbols-rounded">cloud_upload</span></button>
        <button class="icon-btn-sm" data-md="resources/about.md" title="About"><span class="material-symbols-rounded">info</span></button>
        <button class="icon-btn-sm" data-md="resources/contact.md" title="Contact"><span class="material-symbols-rounded">mail</span></button>
        <button class="icon-btn-sm" data-md="resources/terms-privacy.md" title="Terms"><span class="material-symbols-rounded">gavel</span></button>
      </div>

      <div class="stat-card">
        <div class="stat-row"><span>Web Views</span> <span class="stat-val" id="statWeb">0</span></div>
        <div class="stat-row"><span>Downloads</span> <span class="stat-val" id="statDl">0</span></div>
        <div style="margin-top:4px; padding-top:10px; border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
            <a href="https://github.com/Tebby2008/OpenNotes" target="_blank" style="font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px">
                <span class="material-symbols-rounded" style="font-size:16px">code</span> GitHub
            </a>
            <button id="themeToggle" title="Toggle Dark Mode"><span class="material-symbols-rounded">dark_mode</span></button>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="main-content">
      <header class="top-bar">
        <button class="btn-circle mobile-btn" id="menuBtn"><span class="material-symbols-rounded">menu</span></button>
        
        <div class="search-wrapper">
          <span class="material-symbols-rounded icon">search</span>
          <input type="text" class="search-input" id="searchInput" placeholder="Search notes..." />
        </div>

        <div class="actions">
           <!-- Include AI Toggle -->
          <button class="btn-circle" id="toggleAi" title="Include AI">
            <span class="material-symbols-rounded fill">auto_awesome</span>
          </button>

          <div class="dropdown" id="sortDropdown">
            <button class="btn-circle" id="sortBtn" title="Sort"><span class="material-symbols-rounded">sort</span></button>
            <div class="dropdown-menu">
              <div class="dd-item active" data-sort="updated-desc">Newest First <span class="material-symbols-rounded" style="font-size:16px">check</span></div>
              <div class="dd-item" data-sort="updated-asc">Oldest First</div>
              <div class="dd-item" data-sort="title-asc">Title A-Z</div>
            </div>
          </div>
          <button class="btn-circle" id="viewToggle" title="Toggle View"><span class="material-symbols-rounded">view_list</span></button>
        </div>
      </header>

      <div class="scroll-area">
        <div id="gallery" class="grid"></div>
      </div>
    </main>
  </div>

  <!-- Document Viewer Drawer -->
  <div class="drawer-overlay" id="docOverlay">
    <div class="drawer">
      <header class="drawer-header">
        <div style="display:flex;align-items:center;gap:16px;overflow:hidden;flex:1;">
          <button class="btn-circle" id="closeDrawer" style="background:var(--border);width:40px;height:40px;"><span class="material-symbols-rounded">arrow_back</span></button>
          <div style="display:flex;flex-direction:column;overflow:hidden;">
              <div class="drawer-title" id="ovTitle">Title</div>
              <div style="font-size:12px;color:var(--text-sec);font-weight:600;" id="ovDate">Date</div>
          </div>
        </div>
        <div style="display:flex;gap:10px;">
           <button class="btn-circle" id="ovShare" title="Copy Link"><span class="material-symbols-rounded">link</span></button>
           <button class="btn-circle" id="ovRaw" title="Open Raw"><span class="material-symbols-rounded">open_in_new</span></button>
        </div>
      </header>
      <div class="drawer-content">
        <iframe class="doc-viewer" id="docFrame"></iframe>
        <aside class="drawer-sidebar">
          <div class="ds-section">
             <a href="#" id="ovDownload" class="btn-main"><span class="material-symbols-rounded">download</span> Download</a>
          </div>
          <div class="ds-section">
            <div style="font-size:11px;text-transform:uppercase;color:var(--text-muted);font-weight:800;letter-spacing:1px;margin-bottom:12px;">Details</div>
            <div class="info-row"><span>Author</span> <strong id="ovAuthor" style="color:var(--text-main)">Name</strong></div>
            <div class="info-row"><span>Type</span> <strong id="ovType">PDF</strong></div>
            <div class="info-row"><span>Views</span> <strong id="ovViews">0</strong></div>
            <div class="info-row"><span>Downloads</span> <strong id="ovDownloads">0</strong></div>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <!-- Info Overlay -->
  <div class="info-overlay" id="infoOverlay">
    <header class="top-bar">
      <button class="btn-circle" id="closeInfo" style="background:var(--border)"><span class="material-symbols-rounded">arrow_back</span></button>
    </header>
    <div class="info-container">
      <div id="infoContent" class="markdown-body"></div>
    </div>
  </div>

  <div class="toast" id="toast">
    <span class="material-symbols-rounded fill" style="color:#4ade80">check_circle</span> <span id="toastMsg">Link copied</span>
  </div>

  <script>
    /* Configuration & State */
    const API_URL = "https://open-notes.tebby2008-li.workers.dev";
    const REPO = { owner: "Tebby2008", name: "OpenNotes", branch: "main" };
    
    let state = {
      notes: [], filter: 'all', showAi: true,
      view: localStorage.getItem('viewMode') || 'grid',
      sort: 'updated-desc', search: ''
    };

    /* DOM Access */
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => document.querySelectorAll(s);
    
    const els = {
      gallery: $('#gallery'), search: $('#searchInput'), sidebar: $('#sidebar'),
      themeBtn: $('#themeToggle'),
      filters: { all: $('#filterAll'), pdf: $('#filterPdf'), docx: $('#filterDocx'), ai: $('#toggleAi') },
      drawer: { 
        el: $('#docOverlay'), close: $('#closeDrawer'), frame: $('#docFrame'), 
        title: $('#ovTitle'), author: $('#ovAuthor'), date: $('#ovDate'), 
        views: $('#ovViews'), downloads: $('#ovDownloads'), type: $('#ovType'),
        dlBtn: $('#ovDownload'), shareBtn: $('#ovShare'), rawBtn: $('#ovRaw')
      },
      info: { el: $('#infoOverlay'), close: $('#closeInfo'), content: $('#infoContent') },
      sort: { btn: $('#sortBtn'), menu: $('#sortDropdown') },
      stats: { web: $('#statWeb'), dl: $('#statDl') }
    };

    /* Theme */
    const isDark = localStorage.getItem('darkMode') === 'true';
    if(isDark) document.body.classList.add('dark-mode');
    
    // Initial AI Button State
    els.filters.ai.classList.toggle('active-ai', state.showAi);

    els.themeBtn.onclick = () => {
      document.body.classList.toggle('dark-mode');
      localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
    };

    /* Logic */
    const fmtDate = (d) => !d ? "—" : new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    const toast = (msg) => {
      const t = $('#toast'); $('#toastMsg').textContent = msg;
      t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000);
    };
    
    async function init() {
      try {
        const raw = await fetch(`https://raw.githubusercontent.com/${REPO.owner}/${REPO.name}/${REPO.branch}/resources/notes_metadata.json`).then(r=>r.json());
        
        state.notes = raw.map(m => ({
            name: m.name, title: m.name.replace(/\.[^/.]+$/, "").replace(/\(AI\)$/, ''), 
            path: m.path, dl: m.download_url, thumb: m.thumbnail_url, 
            fmt: (m.name.split('.').pop()||"").toLowerCase(),
            upd: m.last_updated, auth: m.author, user: m.author_username,
            ai: m.is_ai_generated, v: 0, d: 0
        })).filter(i => ['pdf','docx'].includes(i.fmt));

        // Fetch Note Stats
        const ids = state.notes.map(n => n.path);
        if(ids.length) {
            const s = await fetch(`${API_URL}?type=stats&noteIds=${ids.join(',')}`).then(res=>res.json()).catch(()=>({}));
            state.notes.forEach(n => { if(s[n.path]) { n.v = s[n.path].views; n.d = s[n.path].downloads; }});
        }

        // Calculate Total Downloads (Sum of notes)
        const totalDl = state.notes.reduce((acc, curr) => acc + (curr.d || 0), 0);
        els.stats.dl.textContent = totalDl.toLocaleString();

        // Fetch Website Views (Unique Endpoint)
        fetch(`${API_URL}?type=website`, {method:'POST'}).then(r=>r.json()).then(d=>els.stats.web.textContent=d.views).catch(()=>{});

        render();
        handleHash();
      } catch(e) { els.gallery.innerHTML = `<div style="padding:20px;text-align:center;color:var(--pdf)">Unable to load notes.</div>`; console.error(e); }
    }

    function render() {
      const q = state.search.toLowerCase();
      let list = state.notes.filter(n => 
        (state.showAi || !n.ai) && 
        (state.filter === 'all' || n.fmt === state.filter) &&
        (n.title.toLowerCase().includes(q) || n.auth.toLowerCase().includes(q))
      );

      list.sort((a,b) => {
        const [key, dir] = state.sort.split('-');
        let vA = a[key==='title'?'title':'upd'], vB = b[key==='title'?'title':'upd'];
        if(key === 'upd') { vA = new Date(vA||0); vB = new Date(vB||0); }
        return dir === 'asc' ? (vA > vB ? 1 : -1) : (vA < vB ? 1 : -1);
      });

      els.gallery.className = state.view === 'grid' ? 'grid' : 'list';
      els.gallery.innerHTML = list.map((n, i) => {
        const authHtml = (n.user?.toLowerCase()==='tebby2008') 
          ? `Chenyu Li <span class="material-symbols-rounded fill" style="color:var(--primary);font-size:14px;">verified</span>` 
          : DOMPurify.sanitize(n.auth);

        return `
        <article class="card" onclick="openDrawer('${n.name}')" style="animation-delay:${i*40}ms">
          <div class="card-thumb">
            <img src="${n.thumb}" loading="lazy" onerror="this.style.display='none'">
            <span class="type-pill is-${n.fmt}">${n.fmt.toUpperCase()}</span>
          </div>
          <div class="card-body">
            <div class="card-title">${n.title}</div>
            <div class="card-footer">
               <div class="user-info">${authHtml}</div>
               ${n.ai ? `<div class="ai-badge"><span class="material-symbols-rounded" style="font-size:14px">auto_awesome</span>AI</div>` : ''}
            </div>
            ${state.view==='grid' ? `
            <div class="stats-row" style="margin-top:auto;">
               <div class="stat-item"><span class="material-symbols-rounded" style="font-size:16px">visibility</span> ${n.v}</div>
               <div class="stat-item"><span class="material-symbols-rounded" style="font-size:16px">download</span> ${n.d}</div>
               <div style="margin-left:auto;font-weight:500">${fmtDate(n.upd)}</div>
            </div>` : ''}
          </div>
        </article>`;
      }).join('');
    }

    /* Filters & Nav */
    function setFilter(type, btn) {
        state.filter = type;
        Object.values(els.filters).forEach(b => { if(b!==els.filters.ai) b.classList.remove('active'); });
        if(btn) btn.classList.add('active');
        render();
    }
    els.filters.all.onclick = () => setFilter('all', els.filters.all);
    els.filters.pdf.onclick = () => setFilter('pdf', els.filters.pdf);
    els.filters.docx.onclick = () => setFilter('docx', els.filters.docx);
    
    // AI Toggle Logic (Top Bar)
    els.filters.ai.onclick = () => { 
        state.showAi = !state.showAi; 
        els.filters.ai.classList.toggle('active-ai', state.showAi);
        render(); 
    };

    els.search.oninput = (e) => { state.search = e.target.value; render(); };
    $('#viewToggle').onclick = () => { 
        state.view = state.view === 'grid' ? 'list' : 'grid'; 
        localStorage.setItem('viewMode', state.view);
        $('#viewToggle span').textContent = state.view === 'grid' ? 'view_list' : 'grid_view';
        render(); 
    };

    els.sort.btn.onclick = (e) => { e.stopPropagation(); els.sort.menu.classList.toggle('active'); };
    $$('.dd-item').forEach(i => i.onclick = () => {
       state.sort = i.dataset.sort;
       $$('.dd-item').forEach(d => d.classList.remove('active'));
       $$('.dd-item span').forEach(ic => ic.remove());
       i.classList.add('active'); i.innerHTML += ` <span class="material-symbols-rounded" style="font-size:16px">check</span>`;
       render();
    });
    document.onclick = () => els.sort.menu.classList.remove('active');

    $('#menuBtn').onclick = () => els.sidebar.classList.add('open');
    document.addEventListener('click', (e) => {
       if(!els.sidebar.contains(e.target) && e.target.id !== 'menuBtn') els.sidebar.classList.remove('open');
    });

    /* Overlay Actions */
    window.openDrawer = (name) => {
      const n = state.notes.find(x => x.name === name);
      if(!n) return;
      history.pushState({note:name}, '', `#Notes/${encodeURIComponent(name)}`);
      
      els.drawer.title.textContent = n.title;
      els.drawer.author.innerHTML = n.user==='Tebby2008' ? 'Chenyu Li' : n.auth;
      els.drawer.date.textContent = fmtDate(n.upd);
      els.drawer.type.textContent = n.fmt.toUpperCase();
      els.drawer.views.textContent = n.v; els.drawer.downloads.textContent = n.d;
      
      els.drawer.frame.src = `https://opennotes.pages.dev/view.html?file=${encodeURIComponent(n.dl)}`;
      els.drawer.dlBtn.href = n.dl; els.drawer.dlBtn.download = n.name;
      els.drawer.rawBtn.onclick = () => window.open(n.dl, '_blank');
      
      els.drawer.dlBtn.onclick = () => {
         fetch(`${API_URL}?type=note&noteId=${n.path}&counter=downloads`, {method:'POST'})
            .then(r=>r.json()).then(d => { if(d){ n.d=d.downloads; els.drawer.downloads.textContent = d.downloads; render(); }});
      };

      fetch(`${API_URL}?type=note&noteId=${n.path}&counter=views`, {method:'POST'})
        .then(r=>r.json()).then(d => { if(d){ n.v=d.views; els.drawer.views.textContent = d.views; render(); }});

      els.drawer.el.classList.add('open');
    };

    els.drawer.close.onclick = () => { els.drawer.el.classList.remove('open'); history.replaceState({},'', '#'); };
    els.drawer.shareBtn.onclick = () => { navigator.clipboard.writeText(location.href); toast('Link copied'); };

    /* Markdown Info */
    $$('button[data-md]').forEach(b => b.onclick = async () => {
       const md = b.dataset.md;
       els.info.el.classList.add('open');
       els.info.content.innerHTML = '<p style="text-align:center;margin-top:50px">Loading...</p>';
       history.pushState({info:md}, '', `#/${md.split('/').pop()}`);
       try {
         const t = await fetch(`https://raw.githubusercontent.com/${REPO.owner}/${REPO.name}/${REPO.branch}/${md}`).then(r=>r.text());
         els.info.content.innerHTML = DOMPurify.sanitize(marked.parse(t));
       } catch { els.info.content.innerHTML = "Error loading content."; }
    });
    els.info.close.onclick = () => { els.info.el.classList.remove('open'); history.replaceState({},'', '#'); };

    function handleHash() {
       const h = location.hash;
       if(h.startsWith('#Notes/')) openDrawer(decodeURIComponent(h.substring(7)));
       else if(h.endsWith('.md')) { 
          const b = $(`button[data-md="resources/${h.substring(2)}"]`);
          if(b) b.click();
       } else { els.drawer.el.classList.remove('open'); els.info.el.classList.remove('open'); }
    }
    window.onpopstate = handleHash;

    init();
  </script>
</body>
</html>
