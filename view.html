<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doc Viewer - OpenNotes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        #doc {
            width: 100vw;
            height: 100vh;
            border: none;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center m-0 p-0">
    <iframe src="" id="doc" style="border:none"></iframe>

    <script>
        function displayDocument() {
            const params = new URLSearchParams(window.location.search);
            const fileUrl = params.get("file");
            const docIframe = document.getElementById("doc");

            const ALLOWED_BASE_URL = "https://raw.githubusercontent.com/Tebby2008/OpenNotes/";
            
            const showError = (message) => {
                console.error(message);
                docIframe.contentDocument.body.innerHTML = `
                    <div style="display:flex; justify-content:center; align-items:center; height:100vh; flex-direction:column; font-family:sans-serif; color:#4b5563;">
                        <h2 style="font-size:1.5rem; margin-bottom:10px;">Access Denied</h2>
                        <p>${message}</p>
                    </div>`;
            };

            if (!fileUrl) {
                showError("No file provided. Please add ?file= to the URL.");
                return;
            }

            if (!fileUrl.startsWith(ALLOWED_BASE_URL)) {
                showError("Security Restricted: Only files from the OpenNotes repository are allowed.");
                return;
            }

            const lowerCaseUrl = fileUrl.toLowerCase();
            const isDocx = lowerCaseUrl.endsWith('.docx');
            const isPdf = lowerCaseUrl.endsWith('.pdf');

            if (!isDocx && !isPdf) {
                showError("Invalid File Type: Only .docx and .pdf files are supported.");
                return;
            }

            let finalUrl = "";

            if (isDocx) {
                finalUrl = 'https://view.officeapps.live.com/op/embed.aspx?src=' + encodeURIComponent(fileUrl);
            } 
            else if (isPdf) {
                finalUrl = 'https://raw.githubusercontent.com/Tebby2008/OpenNotes/resources/pdfjs/web/viewer.html?file=' + encodeURIComponent(fileUrl);
            }
            
            docIframe.src = finalUrl;
        }

        window.onload = displayDocument;
    </script>
</body>
</html>
