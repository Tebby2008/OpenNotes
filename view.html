<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doc Viewer - OpenNotes</title>
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f3f4f6; 
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        #doc {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .error-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            font-family: sans-serif;
            color: #4b5563;
            text-align: center;
            padding: 20px;
        }
        .error-title {
            font-size: 1.5rem;
            margin-bottom: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <iframe src="" id="doc"></iframe>
    <script>
        function displayDocument() {
            const params = new URLSearchParams(window.location.search);
            const fileUrl = params.get("file");
            const docIframe = document.getElementById("doc");

            const ALLOWED_BASE_URL = "https://raw.githubusercontent.com/Tebby2008/OpenNotes/";
            
            const showError = (message) => {
                console.error(message);
                docIframe.contentDocument.body.innerHTML = `
                    <div class="error-container">
                        <div class="error-title">Access Denied</div>
                        <p>${message}</p>
                    </div>
                    <style>
                        .error-container { display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; font-family: sans-serif; color: #4b5563; text-align: center; }
                        .error-title { font-size: 1.5rem; margin-bottom: 10px; font-weight: bold; }
                    </style>`;
            };

            if (!fileUrl) {
                showError("No file provided. Please add ?file= to the URL.");
                return;
            }

            if (!fileUrl.startsWith(ALLOWED_BASE_URL)) {
                showError("Security Restricted: Only files from the OpenNotes repository are allowed.");
                return;
            }

            const lowerCaseUrl = fileUrl.toLowerCase();
            const isDocx = lowerCaseUrl.endsWith('.docx');
            const isPdf = lowerCaseUrl.endsWith('.pdf');

            if (!isDocx && !isPdf) {
                showError("Invalid File Type: Only .docx and .pdf files are supported.");
                return;
            }

            let finalUrl = "";

            if (isDocx) {
                finalUrl = 'https://view.officeapps.live.com/op/embed.aspx?src=' + encodeURIComponent(fileUrl);
            } 
            else if (isPdf) {
                finalUrl = 'resources/pdfjs/web/viewer.html?file=' + encodeURIComponent(fileUrl);
            }
            
            docIframe.src = finalUrl;
        }

        window.onload = displayDocument;
    </script>
</body>
</html>
