<!DOCTYPE html>
<html>
<head>
    <title>OpenNotes - Notes made open</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta http-equiv="refresh" content="0; url=https://opennotes.pages.dev/">

    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        #redirect-message { color: #007bff; }
    </style>
</head>
<body>
    <div id="redirect-message">
        <p>If you are not redirected automatically, <a id="manualLink" href="https://opennotes.pages.dev/">click here</a>.</p>
    </div>

    <script>       
        const NEW_BASE_URL = 'https://opennotes.pages.dev';
        const OLD_BASE_PATH = '/OpenNotes';
        
        const oldPath = window.location.pathname;
        const oldHash = window.location.hash;
        
        let pathSegment = oldPath;
        if (oldPath.startsWith(OLD_BASE_PATH)) {
            pathSegment = oldPath.substring(OLD_BASE_PATH.length);
        }

        const newURL = `${NEW_BASE_URL}${pathSegment}${oldHash}`;
        
        document.getElementById('manualLink').href = newURL;

        window.location.replace(newURL);

    </script>
</body>
</html>
